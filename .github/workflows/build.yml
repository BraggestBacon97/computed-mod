name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Prepare nightly jar artifact
        if: github.event_name == 'push'
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(ls build/libs/*.jar | grep -Ev '(-sources|-javadoc)' | head -n 1 || true)"
          if [[ -z "${artifact}" ]]; then
            echo "No jar artifact found in build/libs"
            exit 1
          fi
          MOD_VERSION=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | xargs)
          short_sha="${GITHUB_SHA:0:8}"
          nightly_name="computed-nightly-${MOD_VERSION}-${short_sha}.jar"
          nightly_path="build/libs/${nightly_name}"
          cp "${artifact}" "${nightly_path}"
          echo "path=${nightly_path}" >> "${GITHUB_OUTPUT}"
          echo "name=${nightly_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload nightly jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30
